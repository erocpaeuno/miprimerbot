<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include "core/styles.html" %}
  <title>Iniciar sesión | Taller</title>
</head>
<body>
  <main>
    <h1>Acceso del personal</h1>
    {% if form.errors %}
      <p role="alert">Usuario o contraseña incorrectos. Inténtalo nuevamente.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Iniciar sesión</button>
    </form>
  </main>
</body>
</html>
