<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include "core/styles.html" %}
  <title>{{ title }} | Taller</title>
</head>
<body>
  <main>
    {% include "core/back_to_panel.html" %}
    <h1>{{ title }}</h1>
    <p>Indica al menos una fecha o un kilometraje para el próximo mantenimiento.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar plan</button>
    </form>
    <p><a href="{% url 'maintenance:index' %}">Volver a mantenimiento</a></p>
  </main>
</body>
</html>
